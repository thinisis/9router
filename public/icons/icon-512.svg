<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050a12"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 96) rotate(90) scale(280)">
      <stop stop-color="#2b7fe8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2b7fe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 420) rotate(90) scale(220)">
      <stop stop-color="#7eb8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7eb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.44"/>
      <stop offset="0.42" stop-color="#b8d9ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2b7fe8" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="edge" x1="256" y1="80" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glyph" x1="256" y1="160" x2="256" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7eb8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2b7fe8" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#orb1)"/>
  <rect width="512" height="512" rx="112" fill="url(#orb2)"/>
  <g filter="url(#shadow)">
    <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#glass)" stroke="url(#edge)" stroke-width="6"/>
    <rect x="80" y="80" width="352" height="160" rx="80" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  <text x="256" y="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="272" font-weight="700" fill="url(#glyph)" text-anchor="middle" filter="url(#glow)">9</text>
</svg>